<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 392" width="840" height="392" role="img" aria-label="Terminal showing quantforge --help from the released 0.2.0 CLI">
  <title>quantforge --help (0.2.0)</title>
  <rect x="0.5" y="0.5" width="839" height="391" rx="12" fill="#0e0f11" stroke="#30353c"/>
  <path d="M0.5 40.5 H839.5" stroke="#30353c" stroke-width="1"/>
  <g transform="translate(18 12)" fill="none" stroke="#8e959e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 12 7 8 3 4"/><path d="M8.5 13.5H14"/>
  </g>
  <g font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8e959e" letter-spacing="0.7">
    <text x="44" y="25">QUANTFORGE 0.2.0</text>
    <text x="820" y="25" text-anchor="end">RELEASED</text>
  </g>
  <g font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#eceef0">
    <text xml:space="preserve" x="30" y="76"><tspan fill="#e8874d">$</tspan> <tspan fill="#e8874d">quantforge</tspan> <tspan fill="#8e959e">--help</tspan></text>
    <text xml:space="preserve" x="30" y="120" fill="#8e959e">CLI-first market data ingestion, research, and controlled live trading framework.</text>
    <text xml:space="preserve" x="30" y="164"><tspan font-weight="600">Usage:</tspan> <tspan fill="#e8874d">quantforge</tspan> [OPTIONS] &lt;COMMAND&gt;</text>
    <text xml:space="preserve" x="30" y="208" font-weight="600">Commands:</text>
    <text xml:space="preserve" x="30" y="230">  <tspan fill="#e8874d">data</tspan>      Historical and incremental data ingestion into SQLite</text>
    <text xml:space="preserve" x="30" y="252">  <tspan fill="#e8874d">backtest</tspan>  Deterministic backtest using locally stored candles</text>
    <text xml:space="preserve" x="30" y="274">  <tspan fill="#e8874d">trade</tspan>     Run or manually close the strategy bot</text>
    <text xml:space="preserve" x="30" y="296">  <tspan fill="#e8874d">monitor</tspan>   Observe Binance state and manage orders manually when needed</text>
    <text xml:space="preserve" x="30" y="318">  <tspan fill="#e8874d">help</tspan>      Print this message or the help of the given subcommand(s)</text>
    <text xml:space="preserve" x="30" y="362"><tspan fill="#e8874d">$</tspan> </text>
  </g>
  <rect x="46.8" y="349" width="8.4" height="16" fill="#e8874d" opacity="0.85"/>
</svg>
